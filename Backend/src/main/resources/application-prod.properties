# Perfil para el deploy público (Render): base en memoria en vez de MySQL.
# Se reinicia vacía en cada arranque del proceso, y DataInitializer la vuelve
# a sembrar sola — que sea efímera es intencional para un demo de portfolio,
# no un descuido. MODE=MySQL relaja algunas diferencias de sintaxis frente a
# MySQL (aunque no todas: DATE_FORMAT, por ejemplo, tuvo que sacarse de
# ChartManager igual porque ni con este modo H2 la reconoce).
spring.datasource.url=jdbc:h2:mem:instrumentosdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# mercadopago.access-token y jwt.secret no se declaran acá: llegan como
# variables de entorno (MERCADOPAGO_ACCESS_TOKEN, JWT_SECRET) puestas en el
# panel de Render, no como texto en el repositorio.
