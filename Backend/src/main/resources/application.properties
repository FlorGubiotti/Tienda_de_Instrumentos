spring.application.name=TiendaDeMusica
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=update
# La sesión no queda abierta durante la serialización: lo que se devuelve
# tiene que traerse explícitamente en la consulta.
spring.jpa.open-in-view=false

jwt.expiration-ms=86400000

# URL del frontend: se usa para las URLs de retorno de Mercado Pago.
# En otro entorno se sobreescribe con la variable APP_FRONTEND_URL.
app.frontend-url=http://localhost:5173

# Orígenes autorizados a consumir la API (separados por coma).
# Se sobreescribe con APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=http://localhost:5173,http://localhost:8080

# Carpeta donde se guardan las imágenes que se suben desde el formulario de
# instrumentos. Va fuera de src/main/resources a propósito: esa carpeta se
# empaqueta dentro del jar en el build, así que escribir ahí en runtime se
# perdería en el próximo build (o directamente no se podría, en un jar
# empaquetado). Ruta relativa al directorio desde el que se arranca la app.
app.uploads-dir=uploads/images

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
