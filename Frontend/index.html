
<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Trémolo: tienda de instrumentos musicales con más de 15 años de experiencia." />
  <title>Trémolo | Tienda de instrumentos musicales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Platypi:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <!--
    Va inline y acá arriba a propósito: tiene que correr antes del primer pintado.
    Si se dejara para cuando monta React, quien tenga elegido el modo oscuro vería
    un destello blanco en cada carga. Es la misma lógica de services/tema.ts.
  -->
  <script>
    (function () {
      try {
        var guardado = localStorage.getItem('tema');
        var tema = (guardado === 'claro' || guardado === 'oscuro')
          ? guardado
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
        document.documentElement.setAttribute('data-tema', tema);
        document.documentElement.setAttribute('data-bs-theme', tema === 'oscuro' ? 'dark' : 'light');
      } catch (e) {
        /* Si localStorage está bloqueado, queda el modo claro por defecto */
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

    crossorigin="anonymous"></script>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
</body>

</html>
